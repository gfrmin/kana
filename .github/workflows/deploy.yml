name: deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  deploy:
    # The recipe lives in site-kit so it is fixed in one place for every site.
    # This file used to be a hand-maintained copy of kaomoji-app's — see commit
    # 8bc56bf, "Bump deploy workflow actions to match kaomoji-app".
    uses: gfrmin/site-kit/.github/workflows/worker-deploy.yml@master
    with:
      build: npm run build
      # kana has no test suite, but it does have eslint that nothing ever ran.
      # Wiring it here makes a lint failure block the deploy.
      test: npm run lint
    secrets: inherit
